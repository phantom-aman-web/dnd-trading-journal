<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="apGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="accentPip" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563EB" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Modern Rounded Hex/Squircle Container -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="#0F172A" stroke="#1E293B" stroke-width="2.5" />

  <!-- Distinct Alpha Geometric Chevron (Greek Alpha + Trading Peak) -->
  <path d="M50 20 L76 74 L60 74 L50 51 L40 74 L24 74 Z" fill="url(#apGradient)" filter="url(#glow)" />

  <!-- Floating Glowing Golden-Green Pip Vertex (Representing Alpha & Precise Execution) -->
  <circle cx="50" cy="40" r="5.5" fill="url(#accentPip)" />
  <circle cx="50" cy="40" r="8" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.6" />

  <!-- Pip Indicators (3 subtle bottom precision marks) -->
  <rect x="36" y="80" width="6" height="3" rx="1.5" fill="#3B82F6" opacity="0.8" />
  <rect x="47" y="80" width="6" height="3" rx="1.5" fill="#10B981" />
  <rect x="58" y="80" width="6" height="3" rx="1.5" fill="#3B82F6" opacity="0.8" />
</svg>
